[package]
name = "leve"
version = "0.6.0"
description = "A lightweight Markdown viewer"
authors = ["Moralia"]
license = "MIT"
edition = "2024"

[lib]
name = "leve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Clipboard só texto, lido em `read_clipboard`: sem `image` (o padrão do arboard, que o
# tauri-plugin-clipboard-manager liga) o binário do macOS não cresce; com o plugin, +244 KB. Ver docs/decisoes.md.
arboard = { version = "3", default-features = false }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "8"
notify-debouncer-mini = "0.6"
sys-locale = "0.3"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# Atualizador com o TLS do sistema (Security.framework / SChannel) em vez de rustls: −613 KB no binário
# do macOS (2026-10-26). No Linux fica o padrão, porque native-tls lá é OpenSSL. Ver docs/decisoes.md.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
tauri-plugin-updater = "2"
# Wayland sem XWayland: o mesmo recurso que o plugin de clipboard liga.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

# Atalhos com o foco no WebView2 (`accel.rs`): as mesmas versões que o Tauri já traz, sem crate novo no grafo.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
# "z" e não "s": 17% menor (5,30 → 4,42 MB medidos em 2026-10-23). O Rust só lê arquivo, confere
# concessão e vigia pasta; o trabalho pesado é do WebView, então a perda de velocidade não aparece.
opt-level = "z"
panic = "abort"
strip = true

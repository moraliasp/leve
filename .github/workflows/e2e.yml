name: e2e
# Teste de ponta a ponta do app em Windows e Linux: tauri-driver + WebdriverIO (tests/e2e). O macOS fica de
# fora porque o tauri-driver não roda nele. Por quê e o que não cobre: docs/decisoes.md, "Teste de ponta a ponta".
#   gh workflow run e2e.yml -f sistemas=ambos     (a pedido; só vale com o arquivo já na main)
#   push em leve/e2e/**                           (prova na própria branch, onde o dispatch ainda não existe)
#   workflow_call                                 (o release.yml chama na #101)
on:
  workflow_dispatch:
    inputs:
      sistemas:
        description: "Sistemas: ambos, windows ou linux"
        type: choice
        options: [ambos, windows, linux]
        default: ambos
  workflow_call:
    inputs:
      sistemas:
        description: "Sistemas: ambos, windows ou linux"
        type: string
        default: ambos
  push:
    branches: ["leve/e2e/**"]
permissions: {}
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matriz:
    # `matrix` não existe no `if` do job, então a escolha de sistemas vira a lista da matriz aqui.
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - id: lista
        env:
          SISTEMAS: ${{ inputs.sistemas }}
        run: |
          linux='{"id":"linux","os":"ubuntu-22.04"}'
          windows='{"id":"windows","os":"windows-latest"}'
          case "${SISTEMAS:-ambos}" in
            linux) lista="[$linux]" ;;
            windows) lista="[$windows]" ;;
            ambos) lista="[$linux,$windows]" ;;
            *) echo "::error::sistemas inválido: $SISTEMAS"; exit 1 ;;
          esac
          echo "lista=$lista" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (${{ matrix.id }})
    needs: matriz
    permissions:
      contents: read # ler o código
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matriz.outputs.lista) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mesmas bibliotecas do ci.yml (o binário linka contra elas) mais o que o teste precisa: o
      # WebKitWebDriver (webkit2gtk-driver) e uma tela virtual (xvfb) com barramento de sessão.
      - name: WebKitGTK, WebKitWebDriver e xvfb
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev webkit2gtk-driver xvfb xauth dbus-x11
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-
      - run: pnpm install --frozen-lockfile
      # Dependências do teste à parte: o pnpm-lock.yaml da raiz alimenta o Flatpak (scripts/flatpak-sources.sh).
      - run: pnpm install --dir tests/e2e --ignore-workspace --frozen-lockfile
      - name: Build debug sem bundle
        run: pnpm tauri build --debug --no-bundle

      # tauri-driver fixado e em cache: `cargo install` compila ~2 min.
      - name: tauri-driver (cache)
        id: cache-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/tauri-driver
            ~/.cargo/bin/tauri-driver.exe
          key: ${{ runner.os }}-tauri-driver-2.1.0
      - name: tauri-driver
        if: steps.cache-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      # Windows: o msedgedriver tem de ser o da versão do WebView2 do runner, que muda com o runner.
      # A ferramenta lê a versão instalada e baixa o driver dela, então só ela vai para o cache.
      - name: msedgedriver-tool (cache)
        if: matrix.id == 'windows'
        id: cache-edge
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/msedgedriver-tool.exe
          key: ${{ runner.os }}-msedgedriver-tool-8c4b34f
      - name: msedgedriver-tool
        if: matrix.id == 'windows' && steps.cache-edge.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
      - name: msedgedriver na versão do WebView2
        if: matrix.id == 'windows'
        run: |
          dir="$RUNNER_TEMP/msedgedriver"
          mkdir -p "$dir"
          cd "$dir"
          "$HOME/.cargo/bin/msedgedriver-tool.exe"
          ls -l "$dir"
          # Temporário: wrapper que liga o log verboso do msedgedriver.
          mkdir -p "$PWD/tests/e2e/artifacts"
          printf '@echo off\r\n"%s" --verbose --log-path="%s" %%*\r\n' "$(cygpath -w "$dir/msedgedriver.exe")" "$(cygpath -w "$PWD/tests/e2e/artifacts/msedgedriver.log")" > "$dir/driver.cmd"
          cat "$dir/driver.cmd"
          echo "MSEDGEDRIVER=$(cygpath -w "$dir/driver.cmd")" >> "$GITHUB_ENV"

      - name: Diagnóstico do app e do WebView2 (Windows, temporário)
        if: matrix.id == 'windows'
        continue-on-error: true
        run: |
          export MSYS2_ARG_CONV_EXCL='*'
          mkdir -p tests/e2e/artifacts
          cmdlines() {
            powershell -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -in 'leve.exe','msedgewebview2.exe' } | ForEach-Object { '{0} {1}: {2}' -f \$_.Name, \$_.ProcessId, \$_.CommandLine.Substring(0, [Math]::Min(420, \$_.CommandLine.Length)) }" || true
          }
          portas() { netstat -ano | grep -i listen | grep -E ":(9222|9515|4444|[0-9]{5}) " | head -12 || true; }
          rodar() { # nome, args do webview (ou vazio), política (0/1)
            echo "== variante $1"
            if [ -n "$2" ]; then export WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS="$2"; fi
            export WEBVIEW2_USER_DATA_FOLDER="$RUNNER_TEMP/wv2-$1"
            if [ "$3" = 1 ]; then
              reg add "HKCU\\Software\\Policies\\Microsoft\\Edge\\WebView2\\AdditionalBrowserArguments" /v "*" /t REG_SZ /d "--remote-debugging-port=9222" /f
            fi
            src-tauri/target/debug/leve.exe "$PWD/docs/exemplo.md" > "tests/e2e/artifacts/app-$1.log" 2>&1 &
            sleep 20
            curl -s -m 5 http://127.0.0.1:9222/json/version | head -c 300 || echo "sem porta de depuração"
            echo; cmdlines | grep -o "^[a-z0-9.]* [0-9]*: .\{0,60\}\|remote-debugging[^ ]*" | head -20
            taskkill /F /IM leve.exe || true
            if [ "$3" = 1 ]; then reg delete "HKCU\\Software\\Policies\\Microsoft\\Edge\\WebView2\\AdditionalBrowserArguments" /f || true; fi
            unset WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS WEBVIEW2_USER_DATA_FOLDER
            sleep 3
          }
          rodar so-env "--remote-debugging-port=9222" 0
          rodar env-com-wry "--remote-debugging-port=9222 --disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection" 0
          rodar politica "" 1
          echo "== msedgedriver direto: o que o app faz durante a espera"
          EXE="$(cygpath -w "$RUNNER_TEMP/msedgedriver/msedgedriver.exe")"
          "$EXE" --port=9515 --verbose --log-path="$(cygpath -w "$PWD/tests/e2e/artifacts/msedgedriver-direto.log")" &
          sleep 3
          APP="$(cygpath -w "$PWD/src-tauri/target/debug/leve.exe" | sed 's|\\|\\\\|g')"
          curl -s -m 100 -X POST http://127.0.0.1:9515/session -H 'content-type: application/json' \
            -d "{\"capabilities\":{\"alwaysMatch\":{\"browserName\":\"webview2\",\"ms:edgeOptions\":{\"binary\":\"$APP\",\"args\":[]}}}}" > "tests/e2e/artifacts/sessao-direta.json" &
          sleep 20
          cmdlines
          portas
          wait %3 2>/dev/null || sleep 50
          head -c 400 tests/e2e/artifacts/sessao-direta.json || true
          echo
          taskkill /F /IM leve.exe || true
          taskkill /F /IM msedgedriver.exe || true
          sleep 2
          echo "-- msedgedriver: linhas do lançamento"; grep -a "WEBVIEW2_ADDITIONAL\|Launching\|Failed" tests/e2e/artifacts/msedgedriver-direto.log | cut -c1-1500 || true
      - name: Roteiros (Linux, sob xvfb)
        if: matrix.id == 'linux'
        run: xvfb-run -a dbus-run-session -- pnpm --dir tests/e2e test
      - name: Roteiros (Windows)
        if: matrix.id == 'windows' && false
        env:
          E2E_TESTE_SEM_PERFIL: "1"
        run: pnpm --dir tests/e2e test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-artefatos-${{ matrix.id }}
          path: tests/e2e/artifacts/
          if-no-files-found: warn
          retention-days: 7

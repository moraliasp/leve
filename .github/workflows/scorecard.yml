name: scorecard
# OpenSSF Scorecard: nota pública de práticas de segurança do repositório (branch protection,
# pin de actions, permissões de token etc.). O resultado vai para a aba Security (SARIF) e para
# api.securityscorecards.dev, que alimenta o selo. Roda na main e uma vez por semana.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  # Recalcular quando o ruleset da main mudar.
  branch_protection_rule:
permissions: {}
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # enviar o SARIF para a aba Security
      id-token: write # OIDC: provar que o resultado publicado saiu deste workflow
      contents: read # ler o código
      actions: read # o Scorecard confere runs e workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

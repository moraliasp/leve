name: packaging
# Gera os manifestos do winget e o cask do Homebrew de uma release já publicada, como artefato do
# run. Não publica nada e não usa token de terceiros: quem publica é o dono, à mão, seguindo
# docs/publicar-pacotes.md. Os hashes vêm do SHA256SUMS.txt da release, conferido pela attestation
# de proveniência do release.yml antes de usar.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão publicada, sem o v (ex.: 0.2.0)"
        required: true
        type: string
permissions: {}
jobs:
  manifests:
    permissions:
      contents: read # ler o código e a release pública
      attestations: read # conferir a attestation do SHA256SUMS.txt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Gerar a partir da release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: '$VERSION' (esperado X.Y.Z, sem o v e sem -rc)."
            exit 1
          fi
          TAG="v$VERSION"
          read -r DRAFT PRE DATE < <(gh release view "$TAG" --json isDraft,isPrerelease,publishedAt \
            --jq '"\(.isDraft) \(.isPrerelease) \(.publishedAt[0:10])"')
          if [ "$DRAFT" != "false" ] || [ "$PRE" != "false" ]; then
            echo "::error::A release $TAG ainda é rascunho ou pre-release; publique antes de gerar os pacotes."
            exit 1
          fi
          mkdir -p sums out
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir sums
          gh attestation verify sums/SHA256SUMS.txt --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          node scripts/packaging.mjs sums/SHA256SUMS.txt "$VERSION" "$DATE" out
          {
            echo "### Pacotes de $TAG"
            echo
            echo "Artefato \`packaging-$VERSION\`. Publicar seguindo docs/publicar-pacotes.md."
            echo
            echo '```'
            (cd out && find packaging -type f | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-${{ inputs.version }}
          path: out/packaging
          if-no-files-found: error
          retention-days: 30

name: ci
# Linux é barato e basta para tipos, testes, build do frontend e lint/compilação do Rust.
# Mac e Windows compilam no release.yml (tag), inclusive nos release candidates.
# `bundle-linux` e `flatpak` só rodam a pedido (workflow_dispatch, entrada `pacote`): ver os comentários.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pacote:
        description: "Prova de empacotamento: linux (AppImage + .deb), flatpak ou ambos"
        type: choice
        options: [linux, flatpak, ambos]
        default: linux
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # O nome do job ("check") é o status exigido pelo ruleset da main: não renomear.
    # Cache de PR fica no escopo do PR; o release.yml não usa cache.
    permissions:
      contents: read # ler o código
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bibliotecas que o Tauri/wry compilam contra no Linux.
      - name: WebKitGTK e afins
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm size
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  bundle-linux:
    # Prova do empacotamento Linux (AppImage + .deb) sem tag nem environment, para quem mexe em
    # tauri.conf.json, dependências do Rust ou no release.yml: `gh workflow run ci.yml --ref <branch>`.
    # Só a pedido porque compila em release sem cache (LTO, codegen-units=1) e empacota: ~6 min de
    # runner por disparo, contra ~2 do `check` com cache; a cada PR seria o quádruplo de minutos para
    # provar algo que só muda quando o bundle muda. O release.yml roda os mesmos scripts de build e de
    # conferência; só a fumaça com xvfb fica aqui.
    # A chave do atualizador é descartável, gerada aqui (a de verdade fica só no environment
    # release): serve para provar que os .sig do AppImage e do .deb saem. Os pacotes deste job não
    # valem para distribuição.
    if: github.event_name == 'workflow_dispatch' && inputs.pacote != 'flatpak'
    permissions:
      contents: read # ler o código
    runs-on: ubuntu-22.04 # mesmo runner do release.yml (glibc 2.35)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WebKitGTK e afins
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Sem cache, como no release.yml: o que se prova aqui é o build que a tag vai fazer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: pnpm install --frozen-lockfile
      - name: Ferramentas do AppImage conferidas por hash
        run: scripts/linux-tools.sh
      # Mesmo script do release.yml: compila com rede e empacota sem rede.
      - name: Build (deb + AppImage, chave descartável)
        env:
          CI: "true"
        run: |
          pnpm tauri signer generate --ci -w "$RUNNER_TEMP/descartavel.key" -p "" >/dev/null
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/descartavel.key")"
          rm -f "$RUNNER_TEMP/descartavel.key"
          export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          scripts/bundle-linux.sh --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Conferir pacotes
        run: |
          B=src-tauri/target/release/bundle
          mkdir -p out
          # Mesmo `cp` e mesmo script de conferência do release.yml.
          cp "$B"/appimage/*.AppImage "$B"/appimage/*.AppImage.sig "$B"/deb/*.deb "$B"/deb/*.deb.sig out/
          ls -l out
          scripts/check-linux-packages.sh out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leve-linux-prova
          path: out/*
          if-no-files-found: error
          retention-days: 7
      # Fumaça sem tela: o AppImage sobe com um documento e continua de pé por 15 s. Não prova a
      # interface (sem leitor, sem clique), só que abre, carrega WebKitGTK e não cai.
      - name: Fumaça do AppImage (xvfb)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11
          APPIMAGE="$(ls "$PWD"/out/*.AppImage)"
          set +e
          xvfb-run -a dbus-run-session -- timeout 15 \
            "$APPIMAGE" --appimage-extract-and-run "$PWD/docs/exemplo.md" > "$RUNNER_TEMP/fumaca.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/fumaca.log"
          # 124 = o `timeout` encerrou o processo aos 15 s, ou seja, ele ficou de pé até lá.
          if [ "$rc" -ne 124 ]; then echo "::error::o AppImage saiu antes dos 15 s (código $rc)"; exit 1; fi
          echo "AppImage ficou de pé por 15 s"

  flatpak:
    # Prova do Flatpak a partir do fonte (packaging/flatpak), sem rede no build, como o Flathub exige:
    # `gh workflow run ci.yml --ref <branch> -f pacote=flatpak`. Gera as fontes do Cargo e do pnpm a
    # partir dos lockfiles, builda com o flatpak-builder do org.flatpak.Builder (o mesmo do Flathub),
    # passa o flatpak-builder-lint no manifesto e no repositório, instala o .flatpak e sobe o app sem
    # tela por 15 s. Só a pedido, como o bundle-linux: baixa o SDK do GNOME e compila em release
    # sem cache (~15 min). Por quê: docs/decisoes.md, "Flatpak a partir do fonte".
    if: github.event_name == 'workflow_dispatch' && inputs.pacote != 'linux'
    permissions:
      contents: read # ler o código
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MANIFEST: packaging/flatpak/br.com.moralia.leve.yml
      APP_ID: br.com.moralia.leve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flatpak e Flathub
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak xvfb xauth dbus-x11
          # O AppArmor do Ubuntu 24.04 barra o namespace de usuário sem privilégio que o bwrap usa.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          flatpak info --user org.flatpak.Builder
      - name: Fontes do Cargo e do pnpm
        run: scripts/flatpak-sources.sh
      - name: Lint do manifesto
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest "$MANIFEST"
      - name: Build (sem rede)
        # O builder instala SDK e extensões pelo `flatpak` do host, que pede uma sessão D-Bus. Sem
        # `--sandbox`, que recusa a fonte `../..` (o checkout) fora da pasta do manifesto; o build já
        # roda sem rede porque o manifesto não pede `--share=network` em build-args (o lint cobra).
        run: |
          dbus-run-session -- flatpak run org.flatpak.Builder --user --force-clean --install-deps-from=flathub \
            --mirror-screenshots-url=https://dl.flathub.org/media/ --repo=flatpak-repo \
            flatpak-build "$MANIFEST"
      - name: Lint do repositório
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo flatpak-repo
      - name: Bundle e instalação
        run: |
          mkdir -p out
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo out/leve.flatpak "$APP_ID"
          ls -l out
          flatpak install --user -y --noninteractive --bundle out/leve.flatpak
          flatpak info --user "$APP_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leve-flatpak-prova
          path: out/leve.flatpak
          if-no-files-found: error
          retention-days: 7
      # Mesma fumaça do AppImage: sobe com um documento e fica de pé por 15 s, agora dentro do sandbox.
      - name: Fumaça do Flatpak (xvfb)
        run: |
          set +e
          xvfb-run -a dbus-run-session -- timeout 15 \
            flatpak run --user "$APP_ID" "$PWD/docs/exemplo.md" > "$RUNNER_TEMP/fumaca.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/fumaca.log"
          if [ "$rc" -ne 124 ]; then echo "::error::o Flatpak saiu antes dos 15 s (código $rc)"; exit 1; fi
          echo "Flatpak ficou de pé por 15 s"

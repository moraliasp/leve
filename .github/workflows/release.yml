name: release
# Tag `vX.Y.Z` publica a versão X.Y.Z; `vX.Y.Z-rc.N` compila a mesma X.Y.Z como pre-release de
# teste (o atualizador ignora pre-release). Mac universal, Windows (NSIS + MSI) e Linux x86_64
# (AppImage + .deb + .rpm) com os pacotes do atualizador assinados, mais o .flatpak (job `flatpak`, sem
# chave), depois do job `audit`; o job `publish` gera latest.json, SHA256SUMS.txt, a attestation de
# proveniência e a release em rascunho. Nada é publicado sem alguém revisar o rascunho.
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    name: audit
    # Vulnerabilidade conhecida nas dependências barra a release antes de qualquer build (scripts/audit.sh).
    # Fora do environment: não vê chave nem segredo. Sem cache, como o resto deste workflow.
    permissions:
      contents: read # ler o código da tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: scripts/audit.sh

  build:
    name: build (${{ matrix.platform }})
    needs: audit
    permissions:
      contents: read # ler o código da tag
      id-token: write # OIDC do azure/login; só usado com a assinatura Windows ligada
    # Segredos e variáveis de assinatura vivem no environment "release" (com revisor),
    # nunca no repositório nem em pull_request. O environment vale para o job inteiro, então
    # com revisor configurado os três jobs da matriz (macOS, Windows e Linux) esperam a aprovação.
    # Ver docs/assinatura.md.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
            sign: false
            notarize: true
          - platform: windows-latest
            targets: ""
            args: ""
            bundle: src-tauri/target/release/bundle
            sign: true
            notarize: false
          # Linux no runner mais antigo ainda mantido: o binário exige a glibc de onde compilou
          # (22.04 = glibc 2.35), então compilar no 24.04 (2.39) deixaria de fora Debian 12,
          # Ubuntu 22.04 e derivados. AppImage, .deb e .rpm; ver docs/decisoes.md.
          - platform: ubuntu-22.04
            targets: ""
            args: --bundles deb,rpm,appimage
            bundle: src-tauri/target/release/bundle
            sign: false
            notarize: false
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      # A assinatura Windows liga sozinha quando a variável WINDOWS_SIGN_PROVIDER existe no
      # environment ("esigner" ou "artifact-signing"). Sem ela, o build sai igual ao de hoje.
      SIGN_WINDOWS: ${{ matrix.sign && vars.WINDOWS_SIGN_PROVIDER != '' }}
      WINDOWS_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGN_PROVIDER }}
      # A assinatura macOS liga sozinha quando a variável APPLE_SIGNING_IDENTITY existe no
      # environment. Sem ela, o build sai igual ao de hoje (ad-hoc, sem notarização).
      SIGN_MACOS: ${{ matrix.notarize && vars.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conferir versão
        shell: bash
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          EXPECTED="${EXPECTED%-rc.*}"
          ACTUAL="$(node scripts/version.mjs)" || {
            echo "::error::Os arquivos de versão divergem entre si. Rode 'pnpm version:set $EXPECTED' e refaça a tag."
            exit 1
          }
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} pede a versão $EXPECTED, mas os arquivos estão em $ACTUAL. Rode 'pnpm version:set $EXPECTED', faça o commit e refaça a tag."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Release compila sem cache nenhum (pnpm e cargo): o cache de Actions de uma tag pode vir
      # do que a main gravou, e um cache envenenado entraria no binário assinado com a chave do
      # atualizador. Custa alguns minutos por release. O ci.yml segue com cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Rust stable (+ targets)
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          read -ra T <<< "$TARGETS"
          if [ "${#T[@]}" -gt 0 ]; then rustup target add "${T[@]}"; fi
      # Bibliotecas do Tauri 2 no Linux (https://v2.tauri.app/start/prerequisites/#linux);
      # `file` e `patchelf` são do empacotamento do AppImage; `libarchive-tools` (bsdtar), da conferência
      # do .rpm. Sem appindicator: o Leve não tem
      # ícone na bandeja.
      - name: WebKitGTK e afins (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf libarchive-tools
      - run: pnpm install --frozen-lockfile
      # Ferramentas do AppImage (AppRun, linuxdeploy e o plugin dele) baixadas aqui, sem a chave,
      # conferidas por hash fixado no repositório e postas no cache do bundler; o Build empacota
      # sem rede (scripts/bundle-linux.sh), então não baixa nada.
      - name: Ferramentas do AppImage conferidas por hash (Linux)
        if: runner.os == 'Linux'
        run: scripts/linux-tools.sh
      - name: Ferramentas de assinatura (CodeSignTool do SSL.com ou signtool + dlib do Artifact Signing)
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: ./scripts/install-sign-tools.ps1
      # Os dois passos abaixo só valem para o Artifact Signing: o token do Azure dura pouco,
      # então compila antes do login e empacota logo depois.
      - name: Compilar antes do login no Azure
        if: env.SIGN_WINDOWS == 'true' && env.WINDOWS_SIGN_PROVIDER == 'artifact-signing'
        run: pnpm tauri build --no-bundle
      - name: Entrar no Azure (OIDC federado, sem segredo de longa duração)
        if: env.SIGN_WINDOWS == 'true' && env.WINDOWS_SIGN_PROVIDER == 'artifact-signing'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # APPLE_API_KEY_PATH é caminho de arquivo: o .p8 vai do secret para o disco do runner.
      - name: Chave de notarização (macOS)
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8" > "$KEY")
          echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Build
        # A CLI do Tauri lê as variáveis APPLE_* sozinha e, com elas, assina e notariza o .app
        # (ver docs/assinatura.md).
        # No Windows, com SIGN_WINDOWS, o --config liga o signCommand (scripts/sign-windows.ps1).
        # Os segredos ESIGNER_* só entram no ambiente do build Windows com o provedor esigner;
        # no macOS, no Linux e sem assinatura ficam vazios. TAURI_SIGNING_* assina os pacotes do
        # atualizador (no Linux, o próprio .AppImage, o .deb e o .rpm).
        env:
          CI: "true"
          BUILD_ARGS: ${{ matrix.args }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ESIGNER_USERNAME: ${{ env.SIGN_WINDOWS == 'true' && env.WINDOWS_SIGN_PROVIDER == 'esigner' && secrets.ESIGNER_USERNAME || '' }}
          ESIGNER_PASSWORD: ${{ env.SIGN_WINDOWS == 'true' && env.WINDOWS_SIGN_PROVIDER == 'esigner' && secrets.ESIGNER_PASSWORD || '' }}
          ESIGNER_CREDENTIAL_ID: ${{ env.SIGN_WINDOWS == 'true' && env.WINDOWS_SIGN_PROVIDER == 'esigner' && secrets.ESIGNER_CREDENTIAL_ID || '' }}
          ESIGNER_TOTP_SECRET: ${{ env.SIGN_WINDOWS == 'true' && env.WINDOWS_SIGN_PROVIDER == 'esigner' && secrets.ESIGNER_TOTP_SECRET || '' }}
          APPLE_CERTIFICATE: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.SIGN_MACOS == 'true' && vars.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_API_KEY || '' }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Falta o segredo TAURI_SIGNING_PRIVATE_KEY no environment release (chave do atualizador)."
            exit 1
          fi
          if [ "$SIGN_MACOS" = "true" ]; then
            for NAME in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY; do
              if [ -z "${!NAME}" ]; then
                echo "::error::Falta o segredo $NAME no environment release (assinatura macOS)."
                exit 1
              fi
            done
            if [ ! -s "$APPLE_API_KEY_PATH" ]; then
              echo "::error::Falta o segredo APPLE_API_KEY_P8 no environment release (assinatura macOS)."
              exit 1
            fi
          else
            # O Tauri trata variável vazia como definida e tentaria importar um certificado vazio.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY
          fi
          # Pacotes do atualizador (.app.tar.gz, .sig) só aqui: o build local não precisa da chave.
          read -ra ARGS <<< "$BUILD_ARGS"
          ARGS+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          if [ "$SIGN_WINDOWS" = "true" ]; then ARGS+=(--config src-tauri/tauri.sign.conf.json); fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            scripts/bundle-linux.sh "${ARGS[@]}"
          else
            pnpm tauri build "${ARGS[@]}"
          fi
      # O Tauri notariza e grampeia só o .app; o .dmg sai assinado e sem ticket.
      - name: Notarizar o .dmg (macOS)
        if: env.SIGN_MACOS == 'true'
        env:
          BUNDLE: ${{ matrix.bundle }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          for DMG in "$BUNDLE"/dmg/*.dmg; do
            xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            spctl --assess --type open --context context:primary-signature --verbose "$DMG"
          done
      # Nomes estáveis por versão e plataforma; o .app.tar.gz do macOS sai como "Leve.app.tar.gz".
      - name: Juntar pacotes
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          V="$(node scripts/version.mjs)"
          mkdir -p out
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp "$BUNDLE"/dmg/*.dmg out/
            cp "$BUNDLE/macos/Leve.app.tar.gz" "out/Leve_${V}_universal.app.tar.gz"
            cp "$BUNDLE/macos/Leve.app.tar.gz.sig" "out/Leve_${V}_universal.app.tar.gz.sig"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            # Leve_X.Y.Z_amd64.AppImage, Leve_X.Y.Z_amd64.deb e Leve-X.Y.Z-1.x86_64.rpm, cada um com o seu .sig.
            cp "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/appimage/*.AppImage.sig "$BUNDLE"/deb/*.deb "$BUNDLE"/deb/*.deb.sig \
              "$BUNDLE"/rpm/*.rpm "$BUNDLE"/rpm/*.rpm.sig out/
            # Exec com %F, MimeType e glibc: o rc reprova se o pacote regredir.
            scripts/check-linux-packages.sh out
          else
            cp "$BUNDLE"/nsis/*-setup.exe "$BUNDLE"/nsis/*-setup.exe.sig "$BUNDLE"/msi/*.msi "$BUNDLE"/msi/*.msi.sig out/
          fi
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leve-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: flatpak
    needs: audit
    # .flatpak a partir do fonte (packaging/flatpak), para instalar com `flatpak install --bundle`
    # até o Leve estar no Flathub. Fora do environment `release`: não usa chave nem segredo (o
    # Flatpak não usa o atualizador do app, e o pacote é provado pelo SHA256SUMS e pela attestation
    # como os demais). Mesmo script do job `flatpak` do ci.yml. Por quê: docs/decisoes.md,
    # "Flatpak a partir do fonte".
    permissions:
      contents: read # ler o código da tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, lint e bundle
        run: |
          V="$(node scripts/version.mjs)"
          scripts/flatpak-build.sh "out/Leve_${V}_x86_64.flatpak"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leve-Flatpak
          path: out/*.flatpak
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # criar a release em rascunho e subir os arquivos
      id-token: write # OIDC para assinar a attestation de proveniência (Sigstore)
      attestations: write # gravar a attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: leve-*
          path: release
          merge-multiple: true
      - name: latest.json e SHA256SUMS.txt
        run: |
          node scripts/latest-json.mjs release "$GITHUB_REF_NAME"
          cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Attestation de proveniência (SLSA): prova que cada arquivo saiu deste workflow, desta tag.
      # Em repositório privado do plano Free o GitHub não emite attestation; aí o passo é pulado.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            release/*.dmg
            release/*.app.tar.gz
            release/*.exe
            release/*.msi
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.flatpak
            release/latest.json
            release/SHA256SUMS.txt
      - name: Release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          # Notas = seção da versão no CHANGELOG.md. Sem ela, a lista de PRs do GitHub, com aviso
          # (a tag é imutável: falhar aqui obrigaria a refazer a release inteira).
          if node scripts/release-notes.mjs "$TAG" "$RUNNER_TEMP/notes.md"; then
            NOTES=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::CHANGELOG.md sem seção para $TAG; notas geradas pelo GitHub. Revise o rascunho."
            NOTES=(--generate-notes)
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft $PRE --verify-tag --title "Leve $TAG" "${NOTES[@]}"
          gh release upload "$TAG" release/* --clobber

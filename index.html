<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leve</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <!-- Textos vêm de src/i18n.ts: data-i18n (texto), data-i18n-html, data-i18n-title, data-i18n-aria-label, data-i18n-placeholder. -->
  <body>
    <div id="app">
      <a id="skip" class="skip" href="#main" data-i18n="bar.skip"></a>
      <header id="bar">
        <div class="group">
          <button id="btn-toc" class="icon" data-i18n-title="bar.toc" data-shortcut="toggle-toc" data-i18n-aria-label="bar.toc" aria-controls="toc" aria-expanded="true">
            <span data-icon="panel-left"></span>
          </button>
          <button id="btn-back" class="icon" data-i18n-title="bar.back" data-shortcut="back" data-i18n-aria-label="bar.back" disabled>
            <span data-icon="chevron-left"></span>
          </button>
          <button id="btn-fwd" class="icon" data-i18n-title="bar.forward" data-shortcut="forward" data-i18n-aria-label="bar.forward" disabled>
            <span data-icon="chevron-right"></span>
          </button>
        </div>
        <div id="title" class="title"></div>
        <div class="group">
          <button id="changes" class="text changes" data-i18n="changes.goFirst" data-i18n-title="changes.goFirst" hidden></button>
          <span id="status" class="status" role="status" aria-live="polite"></span>
          <button id="btn-theme" class="icon" data-i18n-title="bar.theme" data-shortcut="cycle-theme" data-i18n-aria-label="bar.themeToggle">
            <span data-icon="sun-moon"></span>
          </button>
          <button id="btn-open" class="text" data-i18n-title="bar.open" data-shortcut="open" data-i18n="bar.openEllipsis"></button>
        </div>
      </header>

      <nav id="tabs" class="tabs" role="tablist" data-i18n-aria-label="bar.tabs" hidden></nav>

      <div id="find" class="find hidden" role="search">
        <input id="find-input" type="search" data-i18n-placeholder="find.placeholder" data-i18n-aria-label="find.placeholder" autocomplete="off" spellcheck="false" />
        <span id="find-count" class="count" aria-hidden="true"></span>
        <span id="find-live" class="sr-only" aria-live="polite" aria-atomic="true"></span>
        <button id="find-prev" class="icon" data-i18n-title="find.prev" data-shortcut="find-prev" data-i18n-aria-label="find.prevLabel"><span data-icon="chevron-up"></span></button>
        <button id="find-next" class="icon" data-i18n-title="find.next" data-shortcut="find-next" data-i18n-aria-label="find.nextLabel"><span data-icon="chevron-down"></span></button>
        <button id="find-close" class="icon" data-i18n-title="common.close" data-shortcut="find-close" data-i18n-aria-label="find.closeLabel"><span data-icon="x"></span></button>
      </div>

      <div id="remote-banner" class="remote-banner" role="status" hidden></div>
      <div id="hidden-banner" class="remote-banner" role="status" hidden></div>
      <div id="body">
        <nav id="toc" class="toc" data-i18n-aria-label="bar.toc"></nav>
        <main id="main" tabindex="0" data-i18n-aria-label="bar.document">
          <article id="content" class="markdown-body" hidden></article>
          <section id="empty" class="empty">
            <h1>Leve</h1>
            <p><span data-i18n-html="empty.lead"></span> <button id="empty-open" class="link" data-i18n="empty.open"></button>.</p>
            <p id="tip" class="tip" hidden>
              <span data-i18n-html="empty.tip"></span>
              <button id="tip-close" class="icon" data-i18n-title="empty.tipClose" data-i18n-aria-label="empty.tipCloseLabel"><span data-icon="x"></span></button>
            </p>
            <div id="recent" class="recent"></div>
          </section>
        </main>
      </div>

      <div id="drop" class="drop hidden" aria-hidden="true"><div data-i18n="empty.drop"></div></div>

      <dialog id="about" class="sheet" aria-labelledby="about-title">
        <h2 id="about-title">Leve <span id="about-version" class="muted"></span></h2>
        <p data-i18n="app.tagline"></p>
        <p id="about-byline" class="muted">Leve · Moralia · MIT</p>
        <p class="muted" data-i18n="app.privacy"></p>
        <p class="muted" data-i18n="app.license"></p>
        <p class="muted" data-i18n="app.credits"></p>
        <p><a id="about-repo" href="https://github.com/moraliasp/leve">github.com/moraliasp/leve</a></p>
        <form method="dialog">
          <button id="about-update" type="button" class="text" data-i18n="update.check"></button>
          <button class="text" data-i18n="common.close"></button>
        </form>
      </dialog>

      <dialog id="confirm" class="sheet" aria-labelledby="confirm-title" aria-describedby="confirm-text">
        <h2 id="confirm-title"></h2>
        <p id="confirm-text"></p>
        <form method="dialog">
          <button class="text" value="cancel" autofocus data-i18n="common.cancel"></button>
          <button id="confirm-ok" class="text primary" value="ok" data-i18n="common.confirm"></button>
        </form>
      </dialog>

      <!-- Mesmo esqueleto das Preferências (cabeçalho, corpo, rodapé fixo; liga/desliga = .switch). -->
      <dialog id="export" class="sheet prefs" aria-labelledby="export-title" aria-describedby="export-lead">
        <header class="prefs-head">
          <h2 id="export-title" data-i18n="export.title"></h2>
        </header>
        <div class="prefs-body">
          <p id="export-lead" data-i18n="export.lead"></p>
          <div class="pref-panel">
            <div class="pref-row">
              <span class="pref-text">
                <label class="pref-label" for="export-md-links" data-i18n="export.mdLinks"></label>
                <span id="export-md-links-hint" class="pref-hint" data-i18n="export.mdLinksHint"></span>
              </span>
              <input type="checkbox" role="switch" class="switch" id="export-md-links" name="export-md-links" aria-describedby="export-md-links-hint" />
            </div>
          </div>
        </div>
        <form method="dialog" class="prefs-foot">
          <button class="text" value="cancel" data-i18n="common.cancel"></button>
          <button id="export-ok" class="text primary" value="ok" autofocus data-i18n="export.ok"></button>
        </form>
      </dialog>

      <!-- Preferências: cabeçalho e rodapé fixos, grupos rolam no meio. Cada linha é rótulo (e dica)
           à esquerda, controle à direita; abaixo de 480 px o controle desce. Escolha única = .seg
           (rádios), liga/desliga = .switch (checkbox com role="switch"). Ids, names e values são
           o contrato com wirePreferences/syncPrefsUI em main.ts. -->
      <dialog id="prefs" class="sheet prefs" aria-labelledby="prefs-title">
        <header class="prefs-head">
          <h2 id="prefs-title" data-i18n="prefs.title"></h2>
          <span class="prefs-help">
            <button id="prefs-shortcuts" type="button" class="ghost" data-i18n-title="prefs.shortcuts" data-i18n-aria-label="prefs.shortcuts" data-shortcut="shortcuts"><span data-icon="keyboard"></span><span data-i18n="prefs.shortcuts"></span></button>
            <button id="prefs-about" type="button" class="ghost" data-i18n-title="prefs.about" data-i18n-aria-label="prefs.about"><span data-icon="info"></span><span data-i18n="prefs.about"></span></button>
          </span>
        </header>

        <div class="prefs-body">
          <section class="pref-group" aria-labelledby="prefs-g-look">
            <h3 id="prefs-g-look" data-i18n="prefs.look"></h3>
            <div class="pref-panel">
              <div class="pref-row" role="radiogroup" aria-labelledby="prefs-theme-label">
                <span id="prefs-theme-label" class="pref-label" data-i18n="prefs.theme"></span>
                <span class="seg">
                  <input type="radio" id="prefs-theme-auto" name="theme" value="auto" /><label for="prefs-theme-auto"><span data-icon="monitor" data-size="14"></span><span data-i18n="theme.auto"></span></label>
                  <input type="radio" id="prefs-theme-light" name="theme" value="light" /><label for="prefs-theme-light"><span data-icon="sun" data-size="14"></span><span data-i18n="theme.light"></span></label>
                  <input type="radio" id="prefs-theme-dark" name="theme" value="dark" /><label for="prefs-theme-dark"><span data-icon="moon" data-size="14"></span><span data-i18n="theme.dark"></span></label>
                </span>
              </div>
              <div class="pref-row" role="radiogroup" aria-labelledby="prefs-style-label">
                <span id="prefs-style-label" class="pref-label" data-i18n="prefs.style"></span>
                <span class="seg">
                  <input type="radio" id="prefs-style-github" name="style" value="github" /><label for="prefs-style-github">GitHub</label>
                  <input type="radio" id="prefs-style-editor" name="style" value="editor" /><label for="prefs-style-editor" data-i18n="style.editor"></label>
                  <input type="radio" id="prefs-style-terminal" name="style" value="terminal" /><label for="prefs-style-terminal" data-i18n="style.terminal"></label>
                  <input type="radio" id="prefs-style-livro" name="style" value="livro" /><label for="prefs-style-livro" data-i18n="style.livro"></label>
                </span>
              </div>
              <div class="pref-row" role="radiogroup" aria-labelledby="prefs-font-label">
                <span id="prefs-font-label" class="pref-label" data-i18n="prefs.font"></span>
                <span class="seg seg-font">
                  <input type="radio" id="prefs-font-auto" name="font" value="auto" /><label for="prefs-font-auto" data-i18n="font.auto"></label>
                  <input type="radio" id="prefs-font-sans" name="font" value="sans" /><label for="prefs-font-sans">Sans</label>
                  <input type="radio" id="prefs-font-serif" name="font" value="serif" /><label for="prefs-font-serif">Serif</label>
                  <input type="radio" id="prefs-font-mono" name="font" value="mono" /><label for="prefs-font-mono">Mono</label>
                </span>
              </div>
              <div class="pref-row" role="radiogroup" aria-labelledby="prefs-width-label">
                <span id="prefs-width-label" class="pref-label" data-i18n="prefs.width"></span>
                <span class="seg">
                  <input type="radio" id="prefs-width-narrow" name="width" value="narrow" /><label for="prefs-width-narrow" data-i18n="width.narrow"></label>
                  <input type="radio" id="prefs-width-normal" name="width" value="normal" /><label for="prefs-width-normal" data-i18n="width.normal"></label>
                  <input type="radio" id="prefs-width-wide" name="width" value="wide" /><label for="prefs-width-wide" data-i18n="width.wide"></label>
                </span>
              </div>
              <div class="pref-row" role="group" aria-labelledby="prefs-zoom-label">
                <span id="prefs-zoom-label" class="pref-label" data-i18n="prefs.zoom"></span>
                <span class="pref-zoom">
                  <span class="stepper">
                    <button id="prefs-zoom-out" type="button" data-i18n-title="prefs.zoomOut" data-shortcut="zoom-out" data-i18n-aria-label="prefs.zoomOutLabel"><span data-icon="minus" data-size="14"></span></button>
                    <output id="prefs-zoom-value" for="prefs-zoom-out prefs-zoom-in prefs-zoom-reset" aria-live="polite">100 %</output>
                    <button id="prefs-zoom-in" type="button" data-i18n-title="prefs.zoomIn" data-shortcut="zoom-in" data-i18n-aria-label="prefs.zoomInLabel"><span data-icon="plus" data-size="14"></span></button>
                  </span>
                  <button id="prefs-zoom-reset" type="button" class="ghost" data-i18n-title="prefs.zoomReset" data-shortcut="zoom-reset" data-i18n="prefs.zoomResetShort"></button>
                </span>
              </div>
              <div class="pref-row" role="radiogroup" aria-labelledby="prefs-lang-label">
                <span id="prefs-lang-label" class="pref-label" data-i18n="prefs.language"></span>
                <span class="seg">
                  <input type="radio" id="prefs-lang-auto" name="lang" value="auto" /><label for="prefs-lang-auto" data-i18n="prefs.langAuto"></label>
                  <input type="radio" id="prefs-lang-pt" name="lang" value="pt-BR" /><label for="prefs-lang-pt" lang="pt-BR">Português</label>
                  <input type="radio" id="prefs-lang-en" name="lang" value="en" /><label for="prefs-lang-en" lang="en">English</label>
                </span>
              </div>
            </div>
          </section>

          <section class="pref-group" aria-labelledby="prefs-g-read">
            <h3 id="prefs-g-read" data-i18n="prefs.reading"></h3>
            <div class="pref-panel">
              <div class="pref-row">
                <label class="pref-label" for="prefs-toc" data-i18n="prefs.tocOpen"></label>
                <input type="checkbox" role="switch" class="switch" id="prefs-toc" name="toc" />
              </div>
              <div class="pref-row">
                <label class="pref-label" for="prefs-restore-scroll" data-i18n="prefs.restoreScroll"></label>
                <input type="checkbox" role="switch" class="switch" id="prefs-restore-scroll" name="restore-scroll" />
              </div>
              <div class="pref-row">
                <label class="pref-label" for="prefs-restore-tabs" data-i18n="prefs.restoreTabs"></label>
                <input type="checkbox" role="switch" class="switch" id="prefs-restore-tabs" name="restore-tabs" />
              </div>
              <div class="pref-row">
                <label class="pref-label" for="prefs-sample" data-i18n="prefs.sample"></label>
                <input type="checkbox" role="switch" class="switch" id="prefs-sample" name="sample" />
              </div>
            </div>
          </section>

          <section class="pref-group" aria-labelledby="prefs-g-integration">
            <h3 id="prefs-g-integration" data-i18n="prefs.integration"></h3>
            <div class="pref-panel">
              <div class="pref-row">
                <span class="pref-text">
                  <label class="pref-label" for="prefs-editor" data-i18n="prefs.editor"></label>
                  <span id="prefs-editor-hint" class="pref-hint" data-i18n="prefs.editorHint"></span>
                </span>
                <select id="prefs-editor" name="editor" class="pref-select" tabindex="0" aria-describedby="prefs-editor-hint"></select>
              </div>
              <div class="pref-row pref-row-block">
                <span class="pref-text">
                  <span class="pref-label" data-i18n="prefs.cli"></span>
                  <span id="prefs-cli-hint" class="pref-hint"></span>
                </span>
                <span id="prefs-cli-actions" class="pref-actions" hidden>
                  <button id="prefs-cli-install" type="button" class="text" data-i18n="prefs.cliInstall" aria-describedby="prefs-cli-hint"></button>
                </span>
              </div>
            </div>
          </section>

          <!-- Lugar do grupo de exportação (leve.exportMdLinks): mesma .pref-group/.pref-panel, uma .pref-row com .switch. -->

          <section class="pref-group" aria-labelledby="prefs-g-privacy">
            <h3 id="prefs-g-privacy" data-i18n="prefs.privacy"></h3>
            <div class="pref-panel">
              <div class="pref-row">
                <span class="pref-text">
                  <label class="pref-label" for="prefs-remote" data-i18n="prefs.remote"></label>
                  <span id="prefs-remote-hint" class="pref-hint" data-i18n="prefs.remoteHint"></span>
                </span>
                <input type="checkbox" role="switch" class="switch" id="prefs-remote" name="remote" aria-describedby="prefs-remote-hint" />
              </div>
              <div class="pref-row">
                <span class="pref-text">
                  <label class="pref-label" for="prefs-hidden" data-i18n="prefs.hidden"></label>
                  <span id="prefs-hidden-hint" class="pref-hint" data-i18n="prefs.hiddenHint"></span>
                </span>
                <input type="checkbox" role="switch" class="switch" id="prefs-hidden" name="hidden" aria-describedby="prefs-hidden-hint" />
              </div>
              <div class="pref-row pref-row-block">
                <span id="prefs-forget-hint" class="pref-hint" data-i18n="prefs.forgetHint"></span>
                <span class="pref-actions">
                  <button id="prefs-clear-recent" type="button" class="text" data-i18n="prefs.clearRecent"></button>
                  <button id="prefs-forget-grants" type="button" class="text danger" data-i18n="prefs.forget" aria-describedby="prefs-forget-hint"></button>
                </span>
              </div>
            </div>
          </section>

          <section class="pref-group" aria-labelledby="prefs-g-updates">
            <h3 id="prefs-g-updates" data-i18n="prefs.updates"></h3>
            <div class="pref-panel">
              <div id="prefs-auto-update-row" class="pref-row">
                <span class="pref-text">
                  <label class="pref-label" for="prefs-auto-update" data-i18n="prefs.autoUpdate"></label>
                  <span id="prefs-auto-update-hint" class="pref-hint" data-i18n="prefs.autoUpdateHint"></span>
                </span>
                <input type="checkbox" role="switch" class="switch" id="prefs-auto-update" name="auto-update" aria-describedby="prefs-auto-update-hint" />
              </div>
              <div class="pref-row pref-row-block">
                <span class="pref-actions">
                  <button id="prefs-check-update" type="button" class="text" data-i18n="update.check"></button>
                </span>
              </div>
            </div>
          </section>
        </div>

        <form method="dialog" class="prefs-foot">
          <button id="prefs-reset" type="button" class="ghost" data-i18n="prefs.reset"></button>
          <button class="text primary" data-i18n="common.close"></button>
        </form>
      </dialog>

      <dialog id="shortcuts" class="sheet" aria-labelledby="shortcuts-title">
        <h2 id="shortcuts-title" data-i18n="shortcuts.title"></h2>
        <dl id="shortcuts-list" class="keys"></dl>
        <form method="dialog"><button class="text" data-i18n="common.close"></button></form>
      </dialog>
    </div>
  </body>
</html>

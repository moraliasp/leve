version: 2
# Um PR por ecossistema por mês, com tudo que mudou junto. Alertas de segurança chegam à parte.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # O KaTeX sobe junto com o do mermaid (hoje ^0.18): versão diferente põe duas cópias no build (+259 kB).
      - dependency-name: katex
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: monthly
    groups:
      npm-e2e:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
